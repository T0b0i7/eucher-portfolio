  <script>(function(){try{var s=localStorage.getItem('ea_lang');var l=s==='en'||s==='fr'?s:((navigator.language||'fr').slice(0,2).toLowerCase()==='en'?'en':'fr');document.documentElement.lang=l}catch(e){}})()</script>
  <link rel="stylesheet" href="assets/css/project-details.css">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/catalog.js" defer></script>

  <script src="assets/js/subpage-i18n.js?v=20261127a" defer></script>

</head>
<body>
  <main class="container" id="projectDetail">
    <a class="back-btn" href="index.html?fromProject=1#projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Retour aux projets
    </a>

    <section class="hero-section" aria-labelledby="projectTitle">
      <div class="hero-text">
        <div class="hero-logo-title">
          <div class="hero-logo" aria-hidden="true"><span id="projectLogo"></span></div>
          <h1 class="hero-title" id="projectTitle" translate="no"></h1>
        </div>
        <p class="hero-subtitle" id="projectSubtitle"></p>
        <div class="hero-tags" id="projectTags" aria-label="Technologies du projet" hidden></div>
      </div>

      <div class="hero-visual" id="projectVisual">
        <div class="hero-image-wrapper">
          <img class="hero-image" id="projectImage" alt="" width="800" height="500" decoding="async">
          <div class="floating-stat" id="featuredStat" hidden>
            <span class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            <span class="value" id="featuredValue"></span>
            <span class="label" id="featuredLabel"></span>
          </div>
        </div>
      </div>
    </section>

    <div class="main-content">
      <div class="left-column">
        <section aria-labelledby="aboutTitle">
          <h2 class="section-title" id="aboutTitle">À propos du projet</h2>
          <div class="project-description" id="projectDescription"></div>
        </section>

        <section id="featuresSection" aria-labelledby="featuresTitle">
          <h2 class="section-title" id="featuresTitle">Fonctionnalités clés</h2>
          <ul class="features-list" id="projectFeatures"></ul>
        </section>
      </div>

      <aside class="right-column" aria-label="Informations du projet">
        <section class="info-card" id="techCard" aria-labelledby="techTitle">
          <h2 class="info-card-title" id="techTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Technologies
          </h2>
          <ul class="tech-grid" id="projectTechnologies"></ul>
        </section>

        <section class="info-card" id="resultsCard" aria-labelledby="resultsTitle">
          <h2 class="info-card-title" id="resultsTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
            <span id="resultsTitleText">Repères du projet</span>
          </h2>
          <div class="results-grid" id="projectResults"></div>
        </section>
      </aside>
    </div>

    <section class="preview-section" id="previewSection" aria-labelledby="previewTitle">
      <h2 class="section-title" id="previewTitle">Aperçu du projet</h2>
      <div class="preview-grid" id="projectPreviewGrid"></div>
    </section>

    <div class="action-buttons" id="projectActions">
      <a class="btn btn-secondary" id="backToProjects" href="index.html?fromProject=1#projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Retour aux projets
      </a>
    </div>
  </main>

  <main class="not-found" id="projectNotFound" hidden>
    <p class="eyebrow">PROJET INTROUVABLE</p>
    <h1>Ce projet n’est pas disponible.</h1>
    <a class="btn btn-secondary" href="index.html?fromProject=1#projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Retour aux projets
    </a>

</body>
</html>
