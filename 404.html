<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page introuvable | Eucher ABATTI</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080a;color:#fff;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center}
    main{max-width:480px;background:#121216;border:1px solid rgba(255,255,255,.08);border-top:3px solid #e60012;border-radius:14px;padding:36px 28px}
    h1{margin:0 0 8px;font-size:48px;color:#e60012}
    h2{margin:0 0 12px;font-size:20px}
    p{margin:0 0 24px;color:#a0a0ab;line-height:1.6}
    a{display:inline-block;padding:10px 20px;background:#e60012;color:#fff;text-decoration:none;border-radius:8px;font-weight:600}
    a:hover{filter:brightness(1.1)}
  </style>
  <script>(function(){try{var l=localStorage.getItem('ea_lang');if(l==='en'){document.documentElement.lang='en';document.title='404 — Page not found | Eucher ABATTI'}}catch(e){}})()</script>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2 id="t">Page introuvable</h2>
    <p id="d">Cette page n’existe pas ou n’est plus accessible.</p>
    <a id="b" href="/">← Retour à l’accueil</a>
  </main>
  <script>
    if(document.documentElement.lang==='en'){
      document.getElementById('t').textContent='Page not found';
      document.getElementById('d').textContent='This page does not exist or is no longer available.';
      document.getElementById('b').textContent='← Back to home';
    }
  </script>
</body>
</html>
